name: CI

on:
  push:
    branches: [ main, development, 'versao/**' ]
  pull_request:
    branches: [ main, development ]

jobs:
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, gd, zip, mbstring, xml, opcache
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Verify test tree before Composer install
        run: bash scripts/verify-composer-tree.sh --allow-missing-vendor

      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --no-progress

      - name: Verify Composer tree after install
        run: bash scripts/verify-composer-tree.sh

      - name: Verify runtime artifact Composer reference normalization
        run: bash tests/runtime_artifact_composer_reference_isolated.sh

      - name: PHP Lint (syntax check)
        run: find app/ public/ routes/ config/ tests/ -name "*.php" -print0 | xargs -0 -n1 php -l

  pdf-regression:
    name: PDF A4 and QR regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, gd, zip, mbstring, xml, opcache
          coverage: none

      - name: Install Poppler utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Verify Composer tree after install
        run: bash scripts/verify-composer-tree.sh

      - name: Run PDF regression suite
        run: bash scripts/test-pdf-regressions.sh

  test:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, gd, zip, mbstring, xml, opcache
          coverage: none

      - name: Install dependencies (with dev)
        run: composer install --prefer-dist --no-progress

      - name: Verify Composer tree after install
        run: bash scripts/verify-composer-tree.sh

      - name: Run automatic payload contract
        run: php tests/report_delivery_automatic_payload_static.php

      - name: Run PatientName release gate contract
        run: php tests/report_release_patient_name_gate_static.php

      - name: Run report signature preference contract
        run: php tests/report_signature_preference_static.php

      - name: Run viewer access contract
        run: php tests/viewer_access_static.php

      - name: Run users navigation contract
        run: php tests/usuarios_navigation_static.php

      - name: Run group notification PostgreSQL boolean contract
        run: php tests/grupo_notificacao_postgresql_boolean_static.php

      - name: Run tests
        run: |
          test_count=$(vendor/bin/phpunit tests --list-tests | awk '/^[[:space:]]*-[[:space:]]+/ {count++} END {print count+0}')
          echo "PHPUNIT_DISCOVERED_TESTS=$test_count"
          if [ "$test_count" -eq 0 ]; then
            echo "::warning::PHPUNIT=NOT_CONCLUSIVE; zero tests were discovered."
            echo "PHPUNIT=NOT_CONCLUSIVE"
            exit 0
          fi
          vendor/bin/phpunit tests --no-coverage
          echo "PHPUNIT=PASS"

  restricted-sync:
    name: Restricted drift sync executor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bash syntax
        run: |
          bash -n ops/deploy/voxelpacs-sync-restricted-drift
          bash -n scripts/provision-restricted-drift-sync.sh
          bash -n tests/restricted_drift_sync_static.sh
          bash -n tests/provision_restricted_drift_sync_static.sh

      - name: ShellCheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x \
              ops/deploy/voxelpacs-sync-restricted-drift \
              scripts/provision-restricted-drift-sync.sh \
              tests/restricted_drift_sync_static.sh \
              tests/provision_restricted_drift_sync_static.sh
          else
            echo "SHELLCHECK=NOT_AVAILABLE"
          fi

      - name: Run isolated executor tests
        run: sudo -n env -u SUDO_USER bash tests/restricted_drift_sync_static.sh

      - name: Run provisioner dry-run tests
        run: sudo -n env -u SUDO_USER bash tests/provision_restricted_drift_sync_static.sh

  deploy-transaction-reconciliation:
    name: Deploy transaction inspection and reconciliation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n ops/deploy/voxelpacs-deploy-transaction
          bash -n ops/deploy/voxelpacs-deploy-runtime
          bash -n scripts/provision-deploy-transaction-helper.sh
          bash -n tests/deploy_transaction_inspection_reconciliation.sh

      - name: ShellCheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x \
              ops/deploy/voxelpacs-deploy-transaction \
              ops/deploy/voxelpacs-deploy-runtime \
              scripts/provision-deploy-transaction-helper.sh \
              tests/deploy_transaction_inspection_reconciliation.sh
          else
            echo "SHELLCHECK=NOT_AVAILABLE"
          fi

      - name: Validate sudoers syntax and scope
        run: |
          if command -v visudo >/dev/null 2>&1; then
            visudo -cf ops/sudoers/voxelpacs-deploy-transaction
          else
            echo "VISUDO=NOT_AVAILABLE"
          fi

      - name: Run isolated transaction tests
        run: sudo -n env -u SUDO_USER bash tests/deploy_transaction_inspection_reconciliation.sh

  production-baseline-capture:
    name: Production baseline capture and Composer sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash and PHP syntax
        run: |
          bash -n scripts/capture-production-baseline.sh
          bash -n scripts/provision-production-baseline-capture.sh
          bash -n ops/deploy/voxelpacs-production-baseline-capture
          php -l tests/deploy/production_baseline_capture_static.php
          bash -n tests/deploy/production_baseline_provisioner_static.sh
          bash -n tests/deploy/production_baseline_capture_isolated.sh
          bash -n tests/deploy/production_baseline_wrapper_failure_isolated.sh
          bash -n tests/deploy/production_baseline_profile_refresh_isolated.sh
          bash -n tests/deploy/production_baseline_provisioner_upgrade_isolated.sh

      - name: ShellCheck provisioner and upgrade regression
        run: |
          shellcheck -S warning -x \
            scripts/provision-production-baseline-capture.sh \
              ops/deploy/voxelpacs-production-baseline-capture \
              tests/deploy/production_baseline_provisioner_static.sh \
              tests/deploy/production_baseline_wrapper_failure_isolated.sh \
              tests/deploy/production_baseline_profile_refresh_isolated.sh \
              tests/deploy/production_baseline_provisioner_upgrade_isolated.sh

      - name: Validate static safety contracts
        run: |
          php tests/deploy/production_baseline_capture_static.php
          bash tests/deploy/production_baseline_provisioner_static.sh
          bash tests/deploy/production_baseline_wrapper_failure_isolated.sh
          bash tests/deploy/production_baseline_profile_refresh_isolated.sh
          bash tests/deploy/production_baseline_provisioner_upgrade_isolated.sh

      - name: Run isolated capture and sidecar tests
        run: bash tests/deploy/production_baseline_capture_isolated.sh

  runtime-drift-manifest-reader:
    name: Root-controlled runtime drift manifest reader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bash syntax
        run: |
          bash -n ops/deploy/voxelpacs-runtime-drift-manifest-reader
          bash -n ops/deploy/voxelpacs-runtime-drift-gate
          bash -n scripts/validate-runtime-drift.sh
          bash -n scripts/provision-runtime-drift-manifest-reader.sh
          bash -n scripts/upgrade-runtime-drift-manifest-reader.sh
          bash -n tests/deploy/runtime_drift_manifest_reader_static.sh
          bash -n tests/deploy/runtime_drift_manifest_reader_isolated.sh
          bash -n tests/deploy/runtime_drift_manifest_reader_upgrade_static.sh
          bash -n tests/deploy/runtime_drift_manifest_reader_upgrade_isolated.sh

      - name: ShellCheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning -x \
              ops/deploy/voxelpacs-runtime-drift-manifest-reader \
              ops/deploy/voxelpacs-runtime-drift-gate \
              scripts/validate-runtime-drift.sh \
              scripts/provision-runtime-drift-manifest-reader.sh \
              scripts/upgrade-runtime-drift-manifest-reader.sh \
              tests/deploy/runtime_drift_manifest_reader_static.sh \
              tests/deploy/runtime_drift_manifest_reader_isolated.sh \
              tests/deploy/runtime_drift_manifest_reader_upgrade_static.sh \
              tests/deploy/runtime_drift_manifest_reader_upgrade_isolated.sh
          else
            echo "SHELLCHECK=NOT_AVAILABLE"
          fi

      - name: Validate sudoers and static safety contract
        run: bash tests/deploy/runtime_drift_manifest_reader_static.sh

      - name: Run isolated reader and gate tests
        run: sudo -n env -u SUDO_USER bash tests/deploy/runtime_drift_manifest_reader_isolated.sh

      - name: Validate upgrade helper contract
        run: bash tests/deploy/runtime_drift_manifest_reader_upgrade_static.sh

      - name: Run isolated upgrade helper tests
        run: sudo -n env -u SUDO_USER bash tests/deploy/runtime_drift_manifest_reader_upgrade_isolated.sh

      - name: Run provisioner dry-run
        run: |
          expected_sha="$(git rev-parse HEAD)"
          sudo -n env -u SUDO_USER bash scripts/provision-runtime-drift-manifest-reader.sh \
            --expected-sha "$expected_sha" --dry-run

